<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{ page.title }}",
        "description": "{{ page.description }}",
        "datePublished": "{{ page.date }}"
        "author": {
            "@type": "Organization",
            "name": "Quanta Science",
            "url": "https://quanta-science.github.io"
        },
        "publisher": {
            "@type": "Organization",
            "name": "Quanta Science",
            "logo": {
                "@type": "ImageObject",
                "url": "https://quanta-science.github.io/assets/img/logo.svg",
                "width": "500", 
                "height": "500"
            }
        },
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{ page.url }}"
        },
        "image": "https://quanta-science.github.io/assets/img/og-preview.png",
    }
</script>

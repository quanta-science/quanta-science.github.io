{% assign url_parts = page.url | split: "/" %}
{% assign rubric_key = url_parts[1] %}
{% assign current_collection = site.collections | find: "label", rubric_key %}
{% assign rubric_name = current_collection.meta_label %}

<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Article",
                "headline": {{ page.title | jsonify }},
                "description": {{ page.description | jsonify }},
                {% if page.date %}"datePublished": "{{ page.date | date_to_xmlschema }}",{% endif %}
                "dateModified": "{% if page.last_modified_at %}{{ page.last_modified_at | date_to_xmlschema }}{% elsif page.date %}{{ page.date | date_to_xmlschema }}{% endif %}",
                "author": {
                    "@type": "Organization",
                    "@id": "{{ site.url }}",
                    "name": "Quanta Science"
                },
                "creator": {
                    "@id": "{{ '/#murat' | relative_url }}"
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "Quanta Science",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "{{ '/assets/img/logo.svg' | relative_url }}",
                        "width": "500", 
                        "height": "500"
                    }
                },
                "reviewedBy": [
                    {
                        "@type": "Person",
                        "@id": "{{ site.url }}/#murat",
                        "name": "Murat Aliyev"
                    },
                    {
                        "@type": "Person",
                        "@id": "{{ site.url }}/#ayat",
                        "name": "Ayat Kairakbaev"
                    }
                ],
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": "{{ page.url | absolute_url }}"
                },
                "image": "{{ '/assets/img/og-preview.png' | relative_url }}",
                "learningResourceType": "Reference Material",
                "educationalLevel": "Secondary School"
            }
            {% if rubric_name %},
            {
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                    "@type": "ListItem",
                    "position": 1,
                    "name": "Quanta Science",
                    "item": "{{ site.url }}/"
                    },
                    {
                    "@type": "ListItem",
                    "position": 2,
                    "name": "{{ rubric_name }}",
                    "item": "{{ site.url }}/{{ rubric_key }}/"
                    },
                    {
                    "@type": "ListItem",
                    "position": 3,
                    "name": {{ page.title | jsonify }},
                    "item": "{{ site.url }}{{ page.url }}"
                    }
                ]
            }
            {% endif %}
        ]
    }
</script>
<!--Quiz, BreadcrumbList -->

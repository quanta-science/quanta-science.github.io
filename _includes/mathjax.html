<!-- MathJax (для формул) -->
<script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true,
            // Добавляем mhchem в список загружаемых пакетов:
            packages: {'[+]': ['mhchem']}
        },
        // Подключаем расширение mhchem
        loader: {
            load: ['[tex]/mhchem']
        },
        chtml: {
            scale: 1
        }
    };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

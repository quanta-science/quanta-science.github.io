<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "{{ page.title }}",
        "description": "{{ page.description }}",
        "datePublished": "{{ page.date }}",
        "dateModified": "{{ page.last_modified_at }}",
        "author": {
            "@type": "Organization",
            "name": "Quanta Science",
            "url": "{{ site.url }}"
        },
        "publisher": {
            "@type": "Organization",
            "name": "Quanta Science",
            "logo": {
                "@type": "ImageObject",
                "url": "{{ '/assets/img/logo.svg' | relative_url }}",
                "width": "500", 
                "height": "500"
            }
        },
        "mainEntityOfPage": {
            "@type": "WebPage",
            "@id": "{{ page.url }}"
        },
        "image": "{{ '/assets/img/og-preview.png' | relative_url }}",
    }
</script>

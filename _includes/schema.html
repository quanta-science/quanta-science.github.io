{% assign url_parts = page.url | split: "/" %}
{% assign rubric_key = url_parts[1] %}
{% assign current_collection = site.collections | where: "label", rubric_key | first %}
{% assign rubric_name = current_collection.meta_label %}

<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Article",
                "headline": {{ page.title | jsonify }},
                "description": {{ page.description | jsonify }},
                {% if page.date %}"datePublished": "{{ page.date | date_to_xmlschema }}",{% endif %}
                "dateModified": "{% if page.last_modified_at %}{{ page.last_modified_at | date_to_xmlschema }}{% elsif page.date %}{{ page.date | date_to_xmlschema }}{% endif %}",
                "author": {
                    "@type": "Organization",
                    "@id": "{{ '/#organization' | site.url }}",
                    "name": "Quanta Science",
                    "url": "{{ site.url }}/",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "{{ '/assets/img/logo.svg' | absolute_url }}",
                        "width": "500", 
                        "height": "500"
                    }
                },
                "creator": {
                    "@id": "{{ '/#murat' | relative_url }}"
                },
                "publisher": {
                    "@type": "Organization",
                    "@id": "{{ '/#organization' | site.url }}"
                },
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": "{{ page.url | absolute_url }}",
                    "reviewedBy": [
                        {
                            "@type": "Person",
                            "@id": "{{ site.url }}/#murat",
                            "name": "Murat Aliyev"
                        },
                        {
                            "@type": "Person",
                            "@id": "{{ site.url }}/#ayat",
                            "name": "Ayat Kairakbaev"
                        }
                    ]
                },
                "image": "{{ '/assets/img/og-preview.png' | absolute_url }}",
                "learningResourceType": "Reference Material",
                "educationalLevel": "Secondary School"
            }
            {% if rubric_name %},
            {
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                    "@type": "ListItem",
                    "position": 1,
                    "name": "Quanta Science",
                    "item": "{{ site.url }}/"
                    },
                    {
                    "@type": "ListItem",
                    "position": 2,
                    "name": "{{ rubric_name }}",
                    "item": "{{ site.url }}/{{ rubric_key }}/"
                    },
                    {
                    "@type": "ListItem",
                    "position": 3,
                    "name": {{ page.title | jsonify }},
                    "item": "{{ page.url | absolute_url }}"
                    }
                ]
            }
            {% endif %}
            {% if page.quizzes %},
            {
                "@type": "Quiz",
                "about": { "@id": "https://quanta-science.github.io/#organization" },
                "name": {{ page.title | append: " - Тест" | jsonify }},
                "hasPart": [
                    {% for quiz in page.quizzes %}
                    {
                    "@type": "Question",
                    "name": {{ quiz.question_text_stripped | default: quiz.question_text | jsonify }},
                    "suggestedAnswer": [
                        {% for option in quiz.options %}
                        {
                        "@type": "Answer",
                        "text": "{% if option.text_stripped != '' %}{{ option.text_stripped }}{% else %}{{ option.text }}{% endif %}"
                        }{% unless forloop.last %},{% endunless %}
                        {% endfor %}
                    ],
                    "acceptedAnswer": [
                        {% for option in quiz.options %}{% if option.is_correct %}
                        {
                        "@type": "Answer",
                        "text": "{% if option.text_stripped != '' %}{{ option.text_stripped }}{% else %}{{ option.text }}{% endif %}"
                        }
                        {% endif %}{% endfor %}
                    ]
                    }{% unless forloop.last %},{% endunless %}
                    {% endfor %}
                ]
            }
            {% endif %}
        ]
    }
</script>

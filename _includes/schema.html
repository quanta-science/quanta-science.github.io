{% assign url_parts = page.url | split: "/" %}
{% assign rubric_key = url_parts[1] %}
{% assign current_collection = site.collections | where: "label", rubric_key | first %}
{% assign rubric_name = current_collection.meta_label %}

<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Article",
                "@id": "{{ page.url | absolute_url }}",
                "headline": {{ page.title | jsonify }},
                "description": {{ page.description | jsonify }},
                {% if page.date %}"datePublished": "{{ page.date | date_to_xmlschema }}",{% endif %}
                {% if page.last_modified_at %}"dateModified": "{{ page.last_modified_at | date_to_xmlschema }}",{% endif %}
                "author": {
                    "@type": "Organization",
                    "@id": "{{ '/#organization' | absolute_url }}",
                    "name": "Quanta Science",
                    "url": "{{ site.url }}",
                    "logo": {
                        "@type": "ImageObject",
                        "url": "{{ '/assets/img/logo.svg' | absolute_url }}",
                        "width": "500", 
                        "height": "500"
                    }
                },
                "creator": {
                    "@type": "Organization",
                    "@id": "{{ '/#organization' | absolute_url }}"
                },
                "publisher": {
                    "@type": "Organization",
                    "@id": "{{ '/#organization' | absolute_url }}"
                },
                "reviewedBy": [
                    {
                        "@type": "Person",
                        "@id": "{{ '/#murat' | absolute_url }}",
                        "name": "Murat Aliyev"
                    },
                    {
                        "@type": "Person",
                        "@id": "{{ '/#ayat' | absolute_url }}",
                        "name": "Ayat Kairakbaev"
                    }
                ],
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": "{{ page.url | absolute_url }}"
                },
                "image": "{{ '/assets/img/og-preview.png' | absolute_url }}"
                {% if page.quizzes %},"subjectOf": { "@id": "{{ page.url | absolute_url }}#quiz-section" }{% endif %}
            }{% if page.quizzes %},
            {
                "@type": "Quiz",
                "@id": "{{ page.url | absolute_url }}#quiz-section",
                "name": {{ page.quizzes.name | jsonify }},
                "hasPart": [
                    {% for quiz in page.quizzes.items %}
                    {
                    "@type": "Question",
                    "eduQuestionType": "Multiple choice",
                    "name": {{ page.quizzes.name | append: ": Вопрос " | append: forloop.index | jsonify }},
                    "text": {{ quiz.question_text_stripped | default: quiz.question_text | jsonify }},
                    "educationalLevel": {{ page.quizzes.educationalLevel | default: "Secondary School" | jsonify }},
                    "learningResourceType": "Reference Material",
                    "encodingFormat" : "text/html",
                    "educationalAlignment": [
                        {
                            "@type": "AlignmentObject",
                            "alignmentType": "educationalSubject",
                            "targetName": {{ rubric_name | jsonify }}
                        }
                    ],
                    "suggestedAnswer": [
                        {% for option in quiz.options %}
                        {
                            "@type": "Answer",
                            "encodingFormat" : "text/html",
                            "text": {{ option.text_stripped | default: option.text | jsonify }}
                        }{% unless forloop.last %},{% endunless %}
                        {% endfor %}
                    ],
                    "acceptedAnswer": [
                        {% assign correct_options = quiz.options | where: "is_correct", true %}
                        {% for option in correct_options %}
                        {
                            "@type": "Answer",
                            "encodingFormat" : "text/html",
                            "text": {{ option.text_stripped | default: option.text | jsonify }}
                        }{% unless forloop.last %},{% endunless %}
                        {% endfor %}
                    ]
                    }{% unless forloop.last %},{% endunless %}
                    {% endfor %}
                ]
            }{% endif %}{% if rubric_name %},
            {
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                    "@type": "ListItem",
                    "position": 1,
                    "name": "Quanta Science",
                    "item": "{{ '/' | absolute_url }}"
                    },
                    {
                    "@type": "ListItem",
                    "position": 2,
                    "name": {{ rubric_name | jsonify }},
                    "item": "{{ rubric_key | append: '/' | absolute_url }}"
                    },
                    {
                    "@type": "ListItem",
                    "position": 3,
                    "name": {{ page.title | jsonify }},
                    "item": "{{ page.url | absolute_url }}"
                    }
                ]
            }{% endif %}
        ]
    }
</script>

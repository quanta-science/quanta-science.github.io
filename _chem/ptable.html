<style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --border-color: #444;
            
            /* Цвета для категорий элементов */
            --alkali-metal: #ff6666;
            --alkaline-earth-metal: #ffdead;
            --transition-metal: #ffc0cb;
            --metalloid: #cccc99;
            --nonmetal: #a0f0a0;
            --noble-gas: #c0ffff;
            --lanthanide: #ffbfff;
            --actinide: #ff99ff;
            --post-transition-metal: #cccccc;
            --unknown: #666666;
        }

        /*body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 20px;
        }*/

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Сетка таблицы: 19 столбцов (1 для номеров периодов + 18 групп) */
        .periodic-table {
            display: grid;
            grid-template-columns: 40px repeat(18, minmax(60px, 1fr));
            grid-gap: 4px;
            max-width: 1400px;
            margin: 0 auto;
            overflow-x: auto;
        }

        /* Шапки групп и периодов */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .group-header {
            padding: 5px 0;
        }

        .period-header {
            height: 100%;
        }

        /* Ячейка элемента */
        .element-cell {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            aspect-ratio: 1 / 1;
            min-height: 65px;
        }

        .element-cell:hover {
            transform: scale(1.08);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .elem-num {
            font-size: 0.75rem;
            font-weight: bold;
            opacity: 0.9;
        }

        .elem-symbol {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
        }

        .elem-name {
            font-size: 0.7rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .elem-mass {
            font-size: 0.65rem;
            text-align: center;
            opacity: 0.8;
        }

        /* Стилизация категорий по классам */
        .alkali-metal { background-color: var(--alkali-metal); color: #000; }
        .alkaline-earth-metal { background-color: var(--alkaline-earth-metal); color: #000; }
        .transition-metal { background-color: var(--transition-metal); color: #000; }
        .metalloid { background-color: var(--metalloid); color: #000; }
        .diatomic-nonmetal, .polyatomic-nonmetal { background-color: var(--nonmetal); color: #000; }
        .noble-gas { background-color: var(--noble-gas); color: #000; }
        .lanthanide { background-color: var(--lanthanide); color: #000; }
        .actinide { background-color: var(--actinide); color: #000; }
        .post-transition-metal { background-color: var(--post-transition-metal); color: #000; }
        .unknown { background-color: var(--unknown); color: #fff; }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: #2c2c2c;
            border: 2px solid #555;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        .close-btn:hover { color: #ff6666; }

        .modal-properties {
            margin-top: 15px;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.9rem;
        }
</style>

<div class="periodic-table" id="periodicTable"></div>

    <!-- Модальное окно -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <button class="close-btn" id="closeModal">&times;</button>
        <h2 id="modalTitle">Свойства элемента</h2>
        <div class="modal-properties" id="modalProperties"></div>
    </div>
</div>

<script>
        const jsonUrl = 'https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json';
        
        // Функция для сопоставления категорий из JSON с CSS классами цветов
        function getCategoryClass(category) {
            const cat = category.toLowerCase();
            if (cat.includes('alkali metal')) return 'alkali-metal';
            if (cat.includes('alkaline earth metal')) return 'alkaline-earth-metal';
            if (cat.includes('transition metal')) return 'transition-metal';
            if (cat.includes('metalloid')) return 'metalloid';
            if (cat.includes('noble gas')) return 'noble-gas';
            if (cat.includes('diatomic nonmetal')) return 'diatomic-nonmetal';
            if (cat.includes('polyatomic nonmetal')) return 'polyatomic-nonmetal';
            if (cat.includes('lanthanide')) return 'lanthanide';
            if (cat.includes('actinide')) return 'actinide';
            if (cat.includes('post-transition metal')) return 'post-transition-metal';
            return 'unknown';
        }

        async function initTable() {
            try {
                const response = await fetch(jsonUrl);
                const data = await response.json();
                const container = document.getElementById('periodicTable');

                // 1. Создаем верхнюю левую пустую ячейку (пересечение шапок)
                const emptyCorner = document.createElement('div');
                container.appendChild(emptyCorner);

                // 2. Генерируем горизонтальную шапку групп (1-18)
                for (let g = 1; g <= 18; g++) {
                    const groupHeader = document.createElement('div');
                    groupHeader.className = 'header group-header';
                    groupHeader.innerText = g;
                    container.appendChild(groupHeader);
                }

                // Массив для отслеживания созданных номеров периодов (боковая шапка)
                // Всего в CSS Grid у нас будет максимум 10 строк периодов (7 основных + лантаноиды/актиноиды)
                const totalRows = 10;
                const periodHeadersGenerated = {};

                // Функция отрисовки боковой шапки периода, если она еще не отрисована для текущей строки ypos
                function checkAndRenderPeriodHeader(ypos) {
                    if (!periodHeadersGenerated[ypos]) {
                        const periodHeader = document.createElement('div');
                        periodHeader.className = 'header period-header';
                        // Для лантаноидов (ypos=9) и актиноидов (ypos=10) выводим знак '*', либо их реальные периоды (6 и 7)
                        if (ypos === 9) periodHeader.innerText = '6*';
                        else if (ypos === 10) periodHeader.innerText = '7*';
                        else periodHeader.innerText = ypos;
                        
                        // Явное позиционирование в Grid: колонка 1, строка ypos + 1 (так как строка 1 — это шапка групп)
                        periodHeader.style.gridColumn = 1;
                        periodHeader.style.gridRow = ypos + 1;
                        container.appendChild(periodHeader);
                        periodHeadersGenerated[ypos] = true;
                    }
                }

                // 3. Рендерим элементы
                data.elements.forEach(element => {
                    // Проверяем и рисуем боковой маркер периода для текущего элемента
                    checkAndRenderPeriodHeader(element.ypos);

                    // Создаем ячейку элемента
                    const cell = document.createElement('div');
                    cell.className = `element-cell ${getCategoryClass(element.category)}`;
                    
                    // Позиционируем элемент по координатам из JSON (+1 сдвиг из-за шапок)
                    cell.style.gridColumn = element.xpos + 1;
                    cell.style.gridRow = element.ypos + 1;

                    // Наполнение ячейки
                    cell.innerHTML = `
                        <div class="elem-num">${element.number}</div>
                        <div class="elem-symbol">${element.symbol}</div>
                        <div class="elem-name">${element.name}</div>
                        <div class="elem-mass">${parseFloat(element.atomic_mass).toFixed(3)}</div>
                    `;

                    // Вешаем событие клика для открытия модального окна
                    cell.addEventListener('click', () => showModal(element));
                    container.appendChild(cell);
                });

            } catch (error) {
                console.error('Ошибка загрузки или парсинга JSON:', error);
                document.getElementById('periodicTable').innerText = 'Не удалось загрузить данные таблицы.';
            }
        }

        // Логика модального окна
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalProperties = document.getElementById('modalProperties');
        const closeModal = document.getElementById('closeModal');

        function showModal(element) {
            modalTitle.innerText = `${element.name} (${element.symbol})`;
            modalProperties.innerHTML = '';

            // Перебираем все свойства объекта и формируем строки "[имя свойства]: [значение свойства]"
            for (const [key, value] of Object.entries(element)) {
                // Если значение — массив или вложенный объект, красиво форматируем его в строку
                let displayValue = value;
                if (typeof value === 'object' && value !== null) {
                    displayValue = JSON.stringify(value);
                } else if (value === null) {
                    displayValue = 'нет данных';
                }

                modalProperties.innerText += `${key}: ${displayValue}\n`;
            }

            modalOverlay.classList.add('active');
        }

        function hideModal() {
            modalOverlay.classList.remove('active');
        }

        closeModal.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) hideModal();
        });

        // Инициализация при загрузке страницы
        window.addEventListener('DOMContentLoaded', initTable);
</script>
